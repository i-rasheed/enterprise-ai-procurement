# Railway config for the Web service.
# Dashboard: Root Directory = /  (repo root — required for Docker monorepo context)
# Dashboard: Railway Config File = /apps/web/railway.toml
#
# Set these service variables before deploy (baked in at build time):
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_APP_NAME

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
