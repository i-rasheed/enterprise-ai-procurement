# Railway config for the Web service (auto-detected when Root Directory = apps/web).
# If the web service does not exist: + New → GitHub Repo → same repo → rename to "web"

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter web build"
watchPatterns = [
  "apps/web/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
startCommand = "HOSTNAME=0.0.0.0 node .next/standalone/apps/web/server.js"
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
