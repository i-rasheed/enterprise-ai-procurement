# Railway config for the Web service.
# Dashboard: Root Directory = / (repo root)
# Dashboard: Railway Config File = /apps/web/railway.toml
#
# If the web service does not exist yet: + New → GitHub Repo → same repo → rename to "web"

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "turbo.json",
]

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
