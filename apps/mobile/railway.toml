# Mobile (Expo) is not hosted on Railway — delete this service if you do not need it.

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter mobile build"

[deploy]
startCommand = "node -e \"require('http').createServer((_,r)=>r.end('SpendWise mobile uses Expo EAS, not Railway.')).listen(process.env.PORT||8080)\""
restartPolicyType = "NEVER"
