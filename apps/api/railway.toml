# Railway config for the API service (auto-detected when Root Directory = apps/api).

[build]
builder = "RAILPACK"
buildCommand = "DATABASE_URL=postgresql://build:build@localhost:5432/build pnpm --filter api build"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
startCommand = "pnpm run railway:start"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
