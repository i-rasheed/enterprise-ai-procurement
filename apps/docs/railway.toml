# Railway config for the Docs service (auto-detected when Root Directory = apps/docs).

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter docs build"
watchPatterns = [
  "apps/docs/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
startCommand = "HOSTNAME=0.0.0.0 node .next/standalone/apps/docs/server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
