# Railway config for the Docs service.
# Dashboard: Root Directory = / (repo root)
# Dashboard: Railway Config File = /apps/docs/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/docs/Dockerfile"
watchPatterns = [
  "apps/docs/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "turbo.json",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
